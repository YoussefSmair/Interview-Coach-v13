<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interview Coach - دليل الوظائف والامتحانات">
    <title>Interview Coach - الوظائف والامتحانات</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Multi-File CSS Architecture -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/jobs.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Top Header Navigation -->
    <header class="app-header">
        <div class="header-container" style="direction: ltr !important;">
            <!-- Left Side: Brand Logo + Language Button -->
            <div class="header-left-brand-group">
                <a href="index.html" class="brand-logo">
                    <img src="images/logo.png" alt="Interview Coach Logo" class="header-logo-img">
                    <span class="logo-title">Interview Coach</span>
                </a>
                <button id="lang-toggle-btn" class="control-btn lang-btn" title="تغيير اللغة / Change Language">
                    <i class="fa-solid fa-globe"></i>
                    <span id="lang-label">EN</span>
                </button>
            </div>
            
            <!-- Right Side: Navigation Links -->
            <div class="header-right-nav">
                <nav class="main-nav">
                    <ul class="nav-links">
                        <li><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home">الرئيسية</span></a></li>
                        <li><a href="jobs.html" class="nav-item active"><i class="fa-solid fa-briefcase"></i> <span data-i18n="nav_jobs">الوظائف</span></a></li>
                        <li><a href="profile.html" class="nav-item"><i class="fa-solid fa-user-gear"></i> <span data-i18n="nav_profile">الملف الشخصي</span></a></li>
                        <li><a href="about.html" class="nav-item"><i class="fa-solid fa-users"></i> <span data-i18n="nav_about">عن المشروع</span></a></li>
                        <li><a href="contact.html" class="nav-item"><i class="fa-solid fa-paper-plane"></i> <span data-i18n="nav_contact">تواصل معنا</span></a></li>
                    </ul>
                </nav>
            </div>
            
            <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Main View Container -->
    <main class="main-content" id="app-viewport">
        <section id="view-jobs" class="view-section active">
            <!-- Rendered by jobs.js / exam.js / results.js -->
        </section>
    </main>

    <!-- Global App Footer -->
    <footer class="app-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <div class="logo-title">Interview Coach</div>
                <p data-i18n="footer_tagline">منصة محاكاة المقابلات الشخصية الذكية المعززة بتقنيات التقييم المؤسسي الحديثة.</p>
            </div>
            <div class="footer-copy">
                <p data-i18n="footer_copyright">جميع الحقوق محفوظة © 2026 لـ Interview Coach.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts In Dependency Order -->
    <script src="js/translations.js"></script>
    <script src="js/state.js"></script>
    <script src="js/data/jobs.js"></script>
    <script src="js/data/job-question-banks/tech.js"></script>
    <script src="js/data/job-question-banks/business.js"></script>
    <script src="js/data/job-question-banks/creative.js"></script>
    <script src="js/data/job-question-banks/security.js"></script>
    <script src="js/data/job-question-banks/other.js"></script>
    <script src="js/data/job-descriptions.js"></script>
    <script src="js/data/questions.js"></script>
    <script src="js/data/courses_jobs.js"></script>
    <script src="js/router.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/results.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/about.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
